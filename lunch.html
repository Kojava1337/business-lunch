<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Собрать ланч — Ланч-экспресс</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="lunch.css">
        <script src="js/dishes.js" defer></script>
        <script src="js/lunch.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Собрать ланч</h1>
            <nav>
                <a href="index.html">О нас</a>
                <a href="lunch.html" class="active">Собрать ланч</a>
                <a href="orders.html">Заказы</a>
                <a href="#contacts">Контакты</a>
            </nav>
        </header>
        <main>
            <section id="soups">
                <h2>Выберите суп</h2>
                <div class="dish-grid"></div>
            </section>
            <section id="main-courses">
                <h2>Выберите главное блюдо</h2>
                <div class="dish-grid"></div>
            </section>
            <section id="drinks">
                <h2>Выберите напиток</h2>
                <div class="dish-grid"></div>
            </section>
        </main>
        <section class="order-section">
            <h2>Сделать заказ</h2>
            <form action="https://httpbin.org/post" method="post">
                <div class="order-column">
                    <h3>Ваш заказ</h3>
                    <label for="soup">Суп</label>
                    <select id="soup" name="soup" required>
                        <option value="">Выберите суп</option>
                        <option value="gazpacho">Гаспачо</option>
                        <option value="mushroom_soup">Грибной суп-пюре</option>
                        <option value="norwegian_soup">Норвежский суп</option>
                    </select>
                    <label for="main_course">Главное блюдо</label>
                    <select id="main_course" name="main_course" required>
                        <option value="">Выберите главное блюдо</option>
                        <option value="fried_potatoes_with_mushrooms">Жареная картошка с грибами</option>
                        <option value="lasagna">Лазанья</option>
                        <option value="chicken_cutlets_with_mashed_potatoes">Котлеты из курицы с картофельным пюре</option>
                    </select>
                    <label for="drink">Напиток</label>
                    <select id="drink" name="drink" required>
                        <option value="">Выберите напиток</option>
                        <option value="orange_juice">Апельсиновый сок</option>
                        <option value="apple_juice">Яблочный сок</option>
                        <option value="carrot_juice">Морковный сок</option>
                    </select>
                    <label for="order_comment">Комментарий к заказу</label>
                    <textarea id="order_comment" name="comment" rows="4"></textarea>
                </div>
                <div class="order-column">
                    <h3>Ваши данные</h3>
                    <label for="customer_name">Имя</label>
                    <input id="customer_name" name="name" type="text" required>
                    <label for="email">Электронная почта</label>
                    <input id="email" name="email" type="email" required>
                    <div class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes" checked>
                        <label for="newsletter">Хочу получать информацию об акциях</label>
                    </div>
                    <label for="phone">Телефон</label>
                    <input id="phone" name="phone" type="tel" required>
                    <label for="address">Адрес доставки</label>
                    <input id="address" name="address" type="text" required>
                    <fieldset>
                        <legend>Время доставки</legend>
                        <input type="radio" id="delivery_asap" name="delivery_type" value="asap" required>
                        <label for="delivery_asap">Как можно скорее</label>
                        <input type="radio" id="delivery_scheduled" name="delivery_type" value="scheduled" required>
                        <label for="delivery_scheduled">К указанному времени</label>
                    </fieldset>
                    <label for="delivery_time">Укажите время доставки</label>
                    <input type="time" id="delivery_time" name="delivery_time" min="07:00" max="23:00" step="300">
                    <div class="form-actions">
                        <button type="reset">Сбросить</button>
                        <button type="submit">Отправить</button>
                    </div>
                </div>
            </form>
        </section>
        <footer id="contacts">
            <p>Контакты</p>
            <p>
                <a href="mailto:info@lunch-express.example">info@lunch-express.example</a>
            </p>
        </footer>
    </body>
</html>
